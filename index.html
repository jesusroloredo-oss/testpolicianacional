<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Policía Nacional</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #38bdf8;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 40px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            text-decoration: none;
            color: #f8fafc;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card:hover {
            transform: translateY(-4px);
            background-color: #0284c7;
            border-color: #38bdf8;
        }
    </style>
</head>
<body>

    <h1>Test Policía Nacional</h1>
    <p>Tema 1: El Derecho</p>

    <div class="grid">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScorlXAy0K7CPXoVVVkJZqB4atgqtjZAPwS8leXbwu5NA_p7A/viewform" target="_blank" class="card">
            Nacionalidad
        </a>

        <a href="https://docs.google.com/forms/d/e/1FAIpQLScZevOuGoqxbBu-UO5gUcLxllOHJtUGXHhBkQNisZBe-6zMbQ/viewform" target="_blank" class="card">
            Ordenamiento Jurídico
        </a>

        <a href="https://docs.google.com/forms/d/e/1FAIpQLScrpxlvrIYydyPTpI63EMrMhHOMgJAFvE2I3bVXZ3JMrPnpLQ/viewform" target="_blank" class="card">
            El Derecho
        </a>

        <a href="https://docs.google.com/forms/d/e/1FAIpQLScEqwJ0xQ2O8wShTgnUP7P9ie32AXjjQv7_VX1MJzt1sP2jCQ/viewform" target="_blank" class="card">
            DGP
        </a>
    </div>

</body>
</html>
